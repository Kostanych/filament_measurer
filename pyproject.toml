[tool.poetry]
name = "filament-measurer"
version = "0.1.0"
description = "Plactic filament production control system"
authors = ["KOS <kostanych1@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.37.0"
scipy = "^1.13.1"
pandas = "^2.2.2"
numpy = "^1.26.4"
altair = "^5.3.0"
opencv-python = "^4.10.0.82"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
exclude = [".git", "__pycache__", "dist"]

[tool.ruff.lint]
# F - real errors, E9 - syntax, B - likely bugs, SIM/RET/UP - readability
select = ["F", "E9", "B", "SIM", "RET", "UP"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["D203", "E203", "E251", "E266", "E302", "E305", "E401", "E402", "E501", "F401", "F403", "W503"]
exclude = [".git", "__pycache__", "dist"]
max-complexity = 10

[tool.isort]
atomic = true
profile = "black"
line_length = 120
skip_gitignore = true
